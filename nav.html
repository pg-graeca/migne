<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navigator (dynamic from .ocr.txt)</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    font-family: system-ui, Arial, sans-serif;
    background: #1e1e1e;
    color: #eee;
  }
  #toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: #2b2b2b;
    border-bottom: 1px solid #444;
    flex: 0 0 auto;
  }
  #toolbar button,
  #toolbar a {
    padding: 7px 16px;
    font-size: 14px;
    border: 1px solid #555;
    border-radius: 4px;
    background: #3a3a3a;
    color: #eee;
    cursor: pointer;
    text-decoration: none;
  }
  #toolbar button:hover:not(:disabled),
  #toolbar a:hover { background: #4a4a4a; }
  #toolbar button:disabled { opacity: 0.4; cursor: default; }
  #editLink { display: none; }
  body.edit-on #editLink { display: inline-flex; align-items: center; }
  #volInput {
    width: 130px;
    padding: 6px;
    font-size: 14px;
    text-align: center;
    border: 1px solid #555;
    border-radius: 4px;
    background: #111;
    color: #eee;
  }
  #pageInput {
    width: 70px;
    padding: 6px;
    font-size: 14px;
    text-align: center;
    border: 1px solid #555;
    border-radius: 4px;
    background: #111;
    color: #eee;
  }
  #info { margin-left: auto; font-size: 14px; color: #bbb; }
  #stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    background: #e9e7e3;
  }
  /* two stacked frames: the current page stays visible until the next one is
     fully laid out, then they cross-fade */
  .pageFrame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #e9e7e3;
    opacity: 0;
    transition: opacity 0.15s linear;
    pointer-events: none;
    z-index: 0;
  }
  .pageFrame.active {
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
  }
  /* waiting indicator: thin bar across the top of the page area (A) */
  #progressBar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    z-index: 3;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.15s linear;
    pointer-events: none;
    background: rgba(0, 0, 0, 0.08);
  }
  #progressBar.on { opacity: 1; }
  #progressBar i {
    position: absolute;
    top: 0; bottom: 0;
    width: 34%;
    background: #c9a227;
    animation: navSlide 1.1s ease-in-out infinite;
  }
  @keyframes navSlide {
    0%   { left: -35%; }
    100% { left: 100%; }
  }
  /* waiting indicator: toolbar chip with a spinner (B) */
  #busy {
    display: none;
    align-items: center;
    gap: 6px;
    margin-right: 10px;
    font-size: 13px;
    color: #cfc6b4;
  }
  #busy.on { display: inline-flex; }
  #busy .dot {
    width: 12px; height: 12px;
    border: 2px solid #5a5a5a;
    border-top-color: #c9a227;
    border-radius: 50%;
    animation: navSpin 0.8s linear infinite;
  }
  @keyframes navSpin { to { transform: rotate(360deg); } }
  /* bilingual pages: "original / translation" jump buttons */
  #sides {
    display: none;
    align-items: center;
    gap: 4px;
    margin: 0;
    padding: 0;
  }
  #sides.on { display: inline-flex; }
  #sides button {
    padding: 7px 10px;
    font-size: 13px;
    border: 1px solid #555;
    border-radius: 4px;
    background: #3a3a3a;
    color: #eee;
    cursor: pointer;
  }
  #sides button:hover { background: #4a4a4a; }
  #sides button.active {
    border-color: #c9a227;
    color: #f0dfae;
    background: #453d24;
  }
  /* covers the iframe while a page is being laid out, in the same paper
     colour as the pages themselves, so switching pages never flashes dark */
  #frameCover {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e9e7e3;
    opacity: 1;
    transition: opacity 0.12s linear;
    pointer-events: none;
  }
  #frameCover.hidden { opacity: 0; }
  #coverLabel {
    font-size: 13px;
    font-style: italic;
    letter-spacing: 0.3px;
    color: #9a9182;
  }
  #imgPopup {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.25);
    z-index: 1000;  }
  #imgPopup.open { display: flex; }
  #imgPopup img {
    max-width: 94vw;
    max-height: 92vh;
    border: 2px solid #555;
    border-radius: 4px;
    background: #fff;
    cursor: grab;
    user-select: none;
  }
  #imgPopup img.dragging { cursor: grabbing; }
  #imgClose {
    position: fixed;
    top: 14px;
    right: 18px;
    font-size: 26px;
    color: #fff;
    background: none;
    border: none;
    cursor: pointer;
    z-index: 1001;
  }
  #imgClose:hover { color: #ff6b6b; }
  .nav-menu {
    position: fixed;
    z-index: 1002;
    display: none;
    min-width: 120px;
    padding: 5px;
    border: 1px solid #555;
    border-radius: 5px;
    background: rgba(43, 43, 43, 0.98);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
  }
  .nav-menu.open { display: block; }
  .nav-menu button {
    display: block;
    width: 100%;
    padding: 7px 10px;
    border: 0;
    border-radius: 3px;
    background: transparent;
    color: #eee;
    font-size: 13px;
    text-align: left;
    cursor: pointer;
  }
  .nav-menu button:hover { background: #4a4a4a; }
</style>
</head>
<body>
<div id="toolbar">
  <button id="prev" title="Previous page (ArrowLeft)">&laquo; Previous</button>
  <button id="next" title="Next page (ArrowRight)">Next &raquo;</button>
  <input id="volInput" type="text" placeholder="vol_1_html" title="Volume folder name or number">
  <input id="pageInput" type="number" min="1" value="1">
  <button id="go">Go</button>
  <button id="img">Img</button>
  <button id="summary">Summary</button>
  <button id="elenchus">Elenchus</button>
  <button id="analtoc">AnalyticToc</button>
  <form id="sides" title="This page prints the original and the translation on the same column numbers">
  <button type="button" id="sideGrc">Original</button>
  <button type="button" id="sideLat">Translation</button>
</form>
<a id="editLink" href="#" target="_blank" rel="noopener">Edit</a>
  <span id="busy"><span class="dot"></span><span id="busyText"></span></span>
  <span id="info"></span>
</div>
<div id="stage">
  <iframe id="frame" class="pageFrame active" title="page"></iframe>
  <iframe id="frame2" class="pageFrame" title="page"></iframe>
  <div id="progressBar"><i></i></div>
  <div id="frameCover"><span id="coverLabel"></span></div>
</div>

<div id="imgPopup">
  <button id="imgClose" title="Close (Esc)">&times;</button>
  <img id="imgPopupImg" alt="page image">
</div>

<div id="navMenu" class="nav-menu" aria-hidden="true">
  <button type="button" id="navMenuCopy">Copy</button>
</div>

<script>
  (function () {
    var MIN = 1;
    var MAX = 5000;
    var DEFAULT_VOL = "vol_1_html";
    var PAGE_WIDTH = 1000; // every page is rendered at this width, whatever the scan size
    var PAGE_HEIGHT = 1600; // every page is rendered at this height (0 = follow the scan)
    var ALIGN_LEFT_X = 50;   // screen px from the page's left edge to the leftmost block
    var ALIGN_LEFT_Y = 50;   // screen px from the page's top edge to the topmost block
    var ALIGN_RIGHT_X = 50;  // screen px from the page's right edge to the rightmost block
    var current = MIN;
    var volume = DEFAULT_VOL;

    var frames = [document.getElementById("frame"), document.getElementById("frame2")];
    var activeIdx = 0;
    var havePage = false;      // a page has been shown at least once
    function activeFrame() {
      return frames[activeIdx];
    }
    var volInput = document.getElementById("volInput");
    var pageInput = document.getElementById("pageInput");
    var info = document.getElementById("info");
    var prevBtn = document.getElementById("prev");
    var nextBtn = document.getElementById("next");
    var editLink = document.getElementById("editLink");
    var navMenu = document.getElementById("navMenu");
    var navMenuCopy = document.getElementById("navMenuCopy");
    var navMenuText = "";
    var navMenuBlock = null;
    var revealTimer = null;
    var frameCover = document.getElementById("frameCover");
    var coverLabel = document.getElementById("coverLabel");
    var busyEl = document.getElementById("busy");
    var busyText = document.getElementById("busyText");
    var progressBar = document.getElementById("progressBar");
    var sidesEl = document.getElementById("sides");
    var busyTimer = null;
    var sideParam = null;

    function isGreekText(s) {
      return /[\u0370-\u03FF\u1F00-\u1FFF]/.test(s || "");
    }

    // pages sharing the same column numbers ("x2" runs): the buttons jump to
    // the twin page (original / translation) instead of flashing blocks
    function showSide(side) {
      var g = colGroups ? colGroups[current] : null;
      if (!g) return;
      var target = side === "lat" ? Math.min(g.end, g.start + 1) : g.start;
      if (target === current) {
        highlightSide(side);
        return;
      }
      sideParam = side;
      load(target);
    }

    // when the twin is not available, at least flash the blocks of that script
    function highlightSide(side) {
      var doc;
      try {
        doc = activeFrame().contentDocument;
      } catch (e) {
        return;
      }
      if (!doc) return;
      var wantGreek = side === "grc";
      var hits = Array.prototype.slice.call(doc.querySelectorAll(".block")).filter(function (b) {
        var t = (b.textContent || "").trim();
        return t && isGreekText(t) === wantGreek;
      });
      hits.forEach(flashBlock);
      if (hits.length) {
        try {
          hits[0].scrollIntoView({ block: "center" });
        } catch (e) { }
      }
    }

    function updateSides() {
      var g = colGroups ? colGroups[current] : null;
      sidesEl.classList.toggle("on", !!g);
      if (!g) return;
      document.getElementById("sideGrc").classList.toggle("active", g.index === 0);
      document.getElementById("sideLat").classList.toggle("active", g.index !== 0);
      document.getElementById("sideGrc").textContent = "Original";
      document.getElementById("sideLat").textContent = g.copies > 1 ? "Translation" : "Text";
    }

    function showBusy() {
      busyText.textContent = "page " + current;
      busyEl.classList.add("on");
      progressBar.classList.add("on");
    }

    function hideBusy() {
      if (busyTimer) {
        clearTimeout(busyTimer);
        busyTimer = null;
      }
      busyEl.classList.remove("on");
      progressBar.classList.remove("on");
    }

    function hideNavMenu() {
      navMenu.classList.remove("open");
      navMenu.setAttribute("aria-hidden", "true");
    }

    function showNavMenu(x, y) {
      navMenu.classList.add("open");
      navMenu.setAttribute("aria-hidden", "false");
      var w = navMenu.offsetWidth || 120;
      var h = navMenu.offsetHeight || 40;
      var left = Math.min(x, window.innerWidth - w - 8);
      var top = Math.min(y, window.innerHeight - h - 8);
      navMenu.style.left = Math.max(8, left) + "px";
      navMenu.style.top = Math.max(8, top) + "px";
    }

    function flashBlock(block) {
      if (!block || !block.classList) return;
      block.classList.remove("copied-flash");
      // restart the animation
      void block.offsetWidth;
      block.classList.add("copied-flash");
      window.setTimeout(function () {
        block.classList.remove("copied-flash");
      }, 900);
    }

    navMenuCopy.addEventListener("click", function () {
      var text = navMenuText || "";
      var block = navMenuBlock;
      hideNavMenu();
      if (!text) return;
      flashBlock(block);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          info.textContent = "Copied block text (" + text.length + " chars).";
        }).catch(function () {
          info.textContent = "Copy failed.";
        });
      } else {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.left = "-10000px";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
        info.textContent = "Copied block text.";
      }
    });

    document.addEventListener("mousedown", function (event) {
      if (!navMenu.contains(event.target)) {
        hideNavMenu();
      }
    });
    window.addEventListener("scroll", hideNavMenu, true);
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") hideNavMenu();
    });

    // Size and centre the page without relying on `zoom` (whose interaction
    // with `margin: auto` made the blocks shift per page). The page keeps its
    // canvas size and is scaled with a transform inside a plain wrapper, so
    // the horizontal position is identical on every page.
    function applyFrame(doc, pageEl, canvasW, canvasH, refW) {
      if (!doc || !pageEl || !canvasW || !canvasH) return;
      var wrap = doc.getElementById("navPageWrap");
      if (!wrap) {
        wrap = doc.createElement("div");
        wrap.id = "navPageWrap";
        wrap.style.cssText = "position:relative;margin:0 auto;overflow:hidden;";
        pageEl.parentNode.insertBefore(wrap, pageEl);
        wrap.appendChild(pageEl);
        pageEl.style.margin = "0";
      }
      var vw = doc.documentElement.clientWidth || PAGE_WIDTH;
      var target = Math.min(PAGE_WIDTH, vw);
      // one scale per volume (refW), never per page
      var s = target / (refW || canvasW);
      // steady page height: PAGE_HEIGHT rendered px, expressed in canvas units
      var boxH = PAGE_HEIGHT > 0 ? PAGE_HEIGHT / s : canvasH;
      pageEl.style.width = canvasW + "px";
      pageEl.style.height = boxH + "px";
      pageEl.style.zoom = "";
      pageEl.style.transformOrigin = "top left";
      pageEl.style.transform = "scale(" + s + ")";
      wrap.style.width = target + "px";
      wrap.style.height = Math.round(boxH * s) + "px";
      // place the group: leftmost at ALIGN_LEFT_X, topmost at ALIGN_LEFT_Y and
      // rightmost at ALIGN_RIGHT_X from the page edges - the horizontal part is
      // achieved by SCALING the group by exactly
      //     (canvasW - leftMargin - rightMargin) / contentWidth
      // so the content always spans the page between both margins.
      var align = doc.__navAlign;
      if (align && align.el) {
        var marginX = ALIGN_LEFT_X / s;
        var marginY = ALIGN_LEFT_Y / s;
        var marginR = ALIGN_RIGHT_X / s;
        var availW = canvasW - marginX - marginR;
        var f = availW / align.w;
        if (!isFinite(f) || f <= 0) f = 1;
        f = Math.max(0.05, Math.min(5, f));
        align.el.style.transform =
          "translate(" + marginX.toFixed(2) + "px," + marginY.toFixed(2) + "px)" +
          " scale(" + f.toFixed(4) + ")" +
          " translate(" + (-align.minLeft) + "px," + (-align.minTop) + "px)";
        doc.__navFit = f;
      }
      doc.__navFrame = { w: canvasW, h: canvasH, refW: refW || canvasW, pageEl: pageEl };    }

    function revealFrame() {
      if (revealTimer) {
        clearTimeout(revealTimer);
        revealTimer = null;
      }
      frameCover.classList.add("hidden");
    }

    // first page only: nothing to show yet, so use the paper-coloured cover
    function showCover() {
      if (revealTimer) clearTimeout(revealTimer);
      coverLabel.textContent = volume + " \u2014 page " + current;
      frameCover.classList.remove("hidden");
      revealTimer = setTimeout(revealFrame, 4000);
    }

    // cross-fade to a fully prepared frame; the old page stays visible until
    // the new one has been laid out, so there is no blank in between
    function swapTo(fr) {
      hideBusy();
      havePage = true;
      var old = frames[activeIdx];
      if (fr === old) {
        revealFrame();
        return;
      }
      fr.classList.add("active");
      old.classList.remove("active");
      activeIdx = frames.indexOf(fr);
      revealFrame();
      updateSides();
      setTimeout(function () {
        if (old !== frames[activeIdx]) {
          try {
            old.removeAttribute("srcdoc");
            old.src = "about:blank";
          } catch (e) { }
        }
      }, 400);
    }

    function hasVisiblePage() {
      return havePage;
    }

    function giveUp(fr) {
      hideBusy();
      // never replace a good page with an empty/error one
      if (!hasVisiblePage() || fr === activeFrame()) {
        swapTo(fr);
      } else {
        info.textContent = volume + " \u2014 page " + current + " (no content)";
      }
    }

    function decorateMissingBlocks(fr) {
      var doc;
      try {
        doc = fr.contentDocument;
      } catch (e) {
        giveUp(fr);
        return;
      }
      if (!doc) {
        giveUp(fr);
        return;
      }
      var blocks = Array.prototype.slice.call(doc.querySelectorAll(".block"));
      if (!blocks.length) {
        giveUp(fr);
        return;
      }

      // The page is only swapped in once html.js has fitted the text to its
      // final font AND the scan has been measured/positioned, so nothing
      // reflows on screen.
      var pending = 2;
      var done = false;
      function partDone() {
        pending -= 1;
        if (!done && pending <= 0) {
          done = true;
          swapTo(fr);
        }
      }
      if (doc.fonts && doc.fonts.ready) {
        doc.fonts.ready.then(partDone, partDone);
      } else {
        partDone();
      }

      var missing = blocks.filter(function (b) {
        return !(b.textContent || "").trim();
      });

      var style = doc.getElementById("missingTextStyle");
      if (!style) {
        style = doc.createElement("style");
        style.id = "missingTextStyle";
        style.textContent =
          ".block.missing-text{outline:1px solid rgba(200,0,0,.35);}" +
          "@keyframes navFlash{0%{background-color:rgba(46,134,222,.55);outline:2px solid rgba(46,134,222,.95);}100%{background-color:transparent;outline:2px solid transparent;}}" +
          ".block.copied-flash{animation:navFlash .8s ease-out;}";
        (doc.head || doc.documentElement).appendChild(style);
      }

      if (!doc.__navCtxBound) {
        doc.__navCtxBound = true;
        doc.addEventListener("contextmenu", function (event) {
          var block = event.target && event.target.closest ? event.target.closest(".block") : null;
          if (!block) return;
          event.preventDefault();
          navMenuText = (block.textContent || "").trim();
          navMenuBlock = block;
          var rect = fr.getBoundingClientRect();
          showNavMenu(rect.left + event.clientX, rect.top + event.clientY);
        });
        doc.addEventListener("mousedown", hideNavMenu);
        doc.addEventListener("scroll", hideNavMenu, true);
      }

      var pageEl = doc.querySelector(".page") || doc.body;
      var pageW = (pageEl && pageEl.offsetWidth) || 1000;
      var pageH = (pageEl && pageEl.offsetHeight) || 1450;
      var blockW = 0;
      var blockH = 0;
      blocks.forEach(function (b) {
        var l = parseFloat(b.style.left) || 0;
        var t = parseFloat(b.style.top) || 0;
        blockW = Math.max(blockW, l + (parseFloat(b.style.width) || 0));
        blockH = Math.max(blockH, t + (parseFloat(b.style.height) || 0));
      });

      // Normalisation: the outermost block edges are placed ALIGN_LEFT_X /
      // ALIGN_LEFT_Y / ALIGN_RIGHT_X screen pixels from the page edges. The
      // horizontal span is achieved by SCALING the whole group of blocks, so
      // the left and right margins are both exact. All blocks (with or without
      // text) are taken into account, and the crop of a block is its own
      // background, so it moves and scales together with its text.
      var minLeft = Infinity;
      var minTop = Infinity;
      var maxRight = 0;
      var maxBottom = 0;
      blocks.forEach(function (b) {
        var l = parseFloat(b.style.left) || 0;
        var t = parseFloat(b.style.top) || 0;
        var w = parseFloat(b.style.width) || 0;
        var h = parseFloat(b.style.height) || 0;
        minLeft = Math.min(minLeft, l);
        minTop = Math.min(minTop, t);
        maxRight = Math.max(maxRight, l + w);
        maxBottom = Math.max(maxBottom, t + h);
      });
      if (!isFinite(minLeft)) minLeft = 0;
      if (!isFinite(minTop)) minTop = 0;

      var content = doc.getElementById("navContent");
      if (!content) {
        content = doc.createElement("div");
        content.id = "navContent";
        content.style.cssText = "position:absolute;left:0;top:0;transform-origin:0 0;";
        pageEl.appendChild(content);
        blocks.forEach(function (b) {
          content.appendChild(b);
        });
      }
      doc.__navAlign = {
        minLeft: minLeft,
        minTop: minTop,
        w: Math.max(1, maxRight - minLeft),
        h: Math.max(1, maxBottom - minTop),
        el: content
      };

      // Keep the vertical scrollbar in the page document at all times, so the
      // usable width never changes from page to page (that alone shifts every
      // block horizontally by half a scrollbar).
      doc.documentElement.style.overflowY = "scroll";
      doc.documentElement.style.overflowX = "hidden";

      var imgUrl = new URL("rectangles/" + editVolume() + "/" + current + ".png", window.location.href).href;

      // Block coordinates are always HALF the scan's pixel size (vol_1:
      // 1896x2834 -> 948x1417). The canvas must be known *before* the scan
      // finishes downloading, otherwise the blocks are first laid out at the
      // authored size and then jump when the image arrives. Reading the PNG
      // header with a 33-byte range request gives the size immediately.
      //
      // Scans of the same volume differ by a few pixels (1896 / 1908 / 1920),
      // which would give every page a slightly different scale and therefore
      // move equally-positioned blocks by up to ~15 px. So the canvas of the
      // first page seen is remembered per volume and reused for all pages of
      // that volume: one scale, one left/right position, for every page.
      var volKey = "navCanvas:" + editVolume();
      var volCanvas = null;
      try {
        var stored = window.sessionStorage.getItem(volKey);
        if (stored) {
          var parts = stored.split("x");
          volCanvas = { w: parseInt(parts[0], 10), h: parseInt(parts[1], 10) };
        }
      } catch (e) {
        volCanvas = null;
      }

      var appliedW = 0;
      var appliedH = 0;
      function sizeWith(w, h, fallback) {
        if (!w || !h) return;
        if (!fallback) {
          // Scale reference per volume: the canvas of the first page seen,
          // plus 2 % slack so slightly bigger scans still fit the panel.
          // It never changes afterwards, so every page of the volume gets the
          // same scale and a block at a given coordinate always lands on the
          // same pixel.
          if (!volCanvas) {
            volCanvas = { w: Math.ceil(w * 1.02), h: Math.ceil(h * 1.02) };
            try {
              window.sessionStorage.setItem(volKey, volCanvas.w + "x" + volCanvas.h);
            } catch (e) { }
          }
        }
        // page box: this page's canvas, so the scan fills it exactly
        var boxW = Math.max(w, Math.ceil(blockW));
        var boxH = Math.max(h, Math.ceil(blockH));
        if (Math.abs(boxW - appliedW) < 1 && Math.abs(boxH - appliedH) < 1) return;
        appliedW = boxW;
        appliedH = boxH;
        applyFrame(doc, pageEl, boxW, boxH, (volCanvas && volCanvas.w) || boxW);
      }

      fetch(imgUrl, { headers: { Range: "bytes=0-64" } })
        .then(function (r) { return r.arrayBuffer(); })
        .then(function (buf) {
          var b = new Uint8Array(buf);
          if (b.length >= 24 && b[0] === 0x89 && b[1] === 0x50) {
            var dv = new DataView(buf);
            sizeWith(Math.round(dv.getUint32(16) / 2), Math.round(dv.getUint32(20) / 2));
          }
        })
        .catch(function () { });

      sizeWith(pageW, pageH, true);   // fallback: keep today's geometry until the scan says otherwise

      var img = new Image();
      img.onload = function () {
        var bgW = Math.round(img.naturalWidth / 2);
        var bgH = Math.round(img.naturalHeight / 2);
        // canvas = scan/2; also corrects the header read if it was unavailable
        sizeWith(bgW, bgH);

        function cropStyle(b) {
          var left = parseFloat(b.style.left) || 0;
          var top = parseFloat(b.style.top) || 0;
          b.style.backgroundImage = "url('" + imgUrl + "')";
          b.style.backgroundRepeat = "no-repeat";
          b.style.backgroundSize = bgW + "px " + bgH + "px";
          b.style.backgroundPosition = "-" + left + "px -" + top + "px";
        }

        function showCrop(b) {
          if (b.dataset.cropShown === "1") return;
          b.dataset.prevBg = b.style.backgroundImage || "";
          b.dataset.prevBgSize = b.style.backgroundSize || "";
          b.dataset.prevBgPos = b.style.backgroundPosition || "";
          b.dataset.prevBgRepeat = b.style.backgroundRepeat || "";
          b.dataset.prevColor = b.style.color || "";
          b.style.display = "block";
          cropStyle(b);
          b.style.color = "transparent";
          b.style.caretColor = "transparent";
          b.style.textShadow = "none";
          b.dataset.cropShown = "1";
        }

        function hideCrop(b) {
          if (b.dataset.cropShown !== "1") return;
          if (b.dataset.prevBg) {
            b.style.backgroundImage = b.dataset.prevBg;
          } else {
            b.style.backgroundImage = "";
          }
          b.style.backgroundSize = b.dataset.prevBgSize || "";
          b.style.backgroundPosition = b.dataset.prevBgPos || "";
          b.style.backgroundRepeat = b.dataset.prevBgRepeat || "";
          b.style.color = b.dataset.prevColor || "";
          b.style.caretColor = "";
          b.style.textShadow = "";
          delete b.dataset.cropShown;
        }

        // Blocks with no text: show their image crop permanently.
        missing.forEach(function (b) {
          b.style.display = "block";
          b.style.visibility = "visible";
          b.style.opacity = "1";
          cropStyle(b);
          b.classList.add("missing-text");
        });

        // Press and hold left mouse on any block: show its image crop in place.
        blocks.forEach(function (b) {
          b.addEventListener("mousedown", function (event) {
            if (event.button !== 0) return;
            event.preventDefault();
            showCrop(b);
          });
          b.addEventListener("mouseup", function () { hideCrop(b); });
          b.addEventListener("mouseleave", function () { hideCrop(b); });
        });
        if (!doc.__navCropReleaseBound) {
          doc.__navCropReleaseBound = true;
          doc.addEventListener("mouseup", function () {
            blocks.forEach(hideCrop);
          });
        }

        console.log("nav: " + missing.length + " block(s) without text; press-hold enabled on " + blocks.length + " block(s) (page " + current + ")");
        partDone();
      };
      img.onerror = function () {
        console.warn("nav: could not load page image " + imgUrl);
        partDone();
      };
      img.src = imgUrl;
    }

    frames.forEach(function (fr) {
      fr.addEventListener("load", function () {
        var want = fr.dataset.pending;
        if (!want) return;                        // about:blank buffer
        var got = "";
        try {
          var meta = fr.contentDocument.querySelector('meta[name="nav-page"]');
          got = meta ? meta.getAttribute("content") : "";
        } catch (e) {
          got = "";
        }
        if (got !== want) return;                 // stale or blank document
        delete fr.dataset.pending;
        decorateMissingBlocks(fr);
      });
    });

    window.addEventListener("resize", function () {
      frames.forEach(function (fr) {
        var doc;
        try {
          doc = fr.contentDocument;
        } catch (e) {
          return;
        }
        if (doc && doc.__navFrame) {
          applyFrame(doc, doc.__navFrame.pageEl, doc.__navFrame.w, doc.__navFrame.h, doc.__navFrame.refW);
        }
      });
    });

    function resolveVolume(raw) {
      if (!raw) return DEFAULT_VOL;
      if (/^rectangles\/vol_\d+_png$/.test(raw)) return raw.replace(/^rectangles\//, "").replace(/_png$/, "_html");
      if (/^htmls\/vol_\d+_html$/.test(raw)) return raw.replace(/^htmls\//, "");
      if (/^vol_\d+_png$/.test(raw)) return raw.replace(/_png$/, "_html");
      if (/^vol_\d+_html$/.test(raw)) return raw;
      if (/^\d+$/.test(raw)) return "vol_" + raw + "_html";
      if (/^vol_\d+$/.test(raw)) return raw + "_html";
      return raw;
    }

    function volumeDir() {
      return "htmls/" + volume;
    }

    function editVolume() {
      var m = volume.match(/^vol_(\d+)(?:_(?:html|png))?$/);
      if (m) return "vol_" + m[1] + "_png";
      return volume.replace(/_html$/, "_png");
    }

    function updateEditLink() {
      var qs = new URLSearchParams();
      qs.set("vol", editVolume());
      qs.set("page", current);
      qs.set("remote", "on");
      qs.set("pattern", "on");
      qs.set("fonts", "on");
      editLink.href = "http://pg.graeca.org/platform/edit/40.html?" + qs.toString();
    }
 
    var colParam = null;

    function readParams() {
      var qs = new URLSearchParams(window.location.search);
      var v = resolveVolume(qs.get("vol"));
      var p = parseInt(qs.get("page"), 10);
      var c = qs.get("col");
      var s = qs.get("side");
      colParam = c;
      sideParam = s;
      return { vol: v, page: isNaN(p) ? null : p, col: c, side: s };
    }

    function clamp(n) {
      if (isNaN(n)) return current;
      return Math.max(MIN, Math.min(MAX, n));
    }

    function updateUrl() {
      var qs = new URLSearchParams();
      qs.set("vol", volume);
      qs.set("page", current);
      if (colParam) qs.set("col", colParam);
      if (sideParam) qs.set("side", sideParam);
      if (document.body.classList.contains("edit-on")) qs.set("edit", "on");
      var url = window.location.pathname + "?" + qs.toString();
      history.replaceState(null, "", url);
    }

    // ------------------------------------------------------------------
    // Dynamic pages: instead of htmls/<vol>/<page>.html the page is built
    // here from rectangles/<vol>/<page>.ocr.txt (blocks + format + rawLLM),
    // exactly like html_build.py does, and loaded with srcdoc.  The scan
    // rectangles/<vol>/<page>.png is used for sizes and crops as before.
    // ------------------------------------------------------------------
    var PAGE_W = 1000, PAGE_H = 1450, BOX_SCALE = 0.5, DEFAULT_FONT_SIZE = 15;

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function parseOcr(text) {
      var blocks = [], sizes = {}, centers = {}, texts = {};
      var layer = null, curId = null, curLines = [];

      function flushText() {
        if (curId !== null) {
          texts[curId] = curLines.join("\n").trim();
          curId = null;
          curLines = [];
        }
      }

      text.split(/\r?\n/).forEach(function (raw) {
        var line = raw.replace(/\s+$/, "");
        if (line.indexOf("# layer=") === 0) {
          if (layer === "rawLLM") flushText();
          var name = line.slice(8);
          layer = (name === "blocks" || name === "format" || name === "rawLLM") ? name : null;
          return;
        }
        if (layer === "blocks") {
          if (!line || line.charAt(0) === "#") return;
          var p = line.split(",");
          if (p.length < 5) return;
          var b = {
            id: parseInt(p[0], 10),
            x1: parseFloat(p[1]), y1: parseFloat(p[2]),
            x2: parseFloat(p[3]), y2: parseFloat(p[4])
          };
          if (isNaN(b.id) || isNaN(b.x1) || isNaN(b.x2)) return;
          blocks.push(b);
          return;
        }
        if (layer === "format") {
          var m = line.match(/^#\s*block\s*=\s*(\d+)\b/);
          if (!m) return;
          var bid = parseInt(m[1], 10);
          var fs = line.match(/fontSize\s*=\s*(\d+)\s*px/i);
          if (fs) sizes[bid] = parseInt(fs[1], 10);
          if (/centerRows\s*=\s*true/i.test(line)) centers[bid] = true;
          return;
        }
        if (layer === "rawLLM") {
          var mb = line.match(/^#\s*block\s*=\s*(\d+)/);
          if (mb) {
            flushText();
            curId = parseInt(mb[1], 10);
            curLines = [];
          } else if (curId !== null) {
            curLines.push(line);
          }
        }
      });
      if (layer === "rawLLM") flushText();
      return { blocks: blocks, sizes: sizes, centers: centers, texts: texts };
    }

    function buildPageHtml(page, parsed, token) {
      var base = new URL(".", location.href).href;
      var parts = [];
      parsed.blocks.forEach(function (b) {
        // int() in html_build.py truncates towards zero - keep the same values
        var left = Math.trunc(Math.min(b.x1, b.x2) * BOX_SCALE);
        var top = Math.trunc(Math.min(b.y1, b.y2) * BOX_SCALE);
        var w = Math.max(1, Math.trunc(Math.abs(b.x2 - b.x1) * BOX_SCALE));
        var h = Math.max(1, Math.trunc(Math.abs(b.y2 - b.y1) * BOX_SCALE));
        var fs = parsed.sizes[b.id] || DEFAULT_FONT_SIZE;
        var align = parsed.centers[b.id] ? "text-align:center;" : "";
        var txt = escapeHtml(parsed.texts[b.id] || "").replace(/\n/g, "<br>");
        parts.push('<div class="block" data-block="' + b.id + '" style="left:' + left +
          "px;top:" + top + "px;width:" + w + "px;height:" + h + "px;font-size:" + fs +
          "px;" + align + '">' + txt + "</div>");
      });

      return "<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\">" +
        '<meta name="viewport" content="width=device-width, initial-scale=1">' +
        '<meta name="nav-page" content="' + token + '">' +
        "<title>Page " + page + "</title>" +
        '<link rel="preload" href="' + base + 'vendor/fonts/GFSDidot-Regular.ttf" as="font" type="font/ttf" crossorigin>' +
        '<link rel="preload" href="' + base + 'vendor/fonts/LibreBodoni.ttf" as="font" type="font/ttf" crossorigin>' +
        "<style>" +
        '@font-face{font-family:"GFS Didot";src:url("' + base + 'vendor/fonts/GFSDidot-Regular.ttf") format("truetype");font-weight:normal;font-style:normal;font-display:block;}' +
        '@font-face{font-family:"Libre Bodoni";src:url("' + base + 'vendor/fonts/LibreBodoni.ttf") format("truetype");font-weight:normal;font-style:normal;font-display:block;}' +
        "*{box-sizing:border-box;}" +
        "body{margin:0;background:#e9e7e3;}" +
        ".page{position:relative;width:" + PAGE_W + "px;height:" + PAGE_H + "px;margin:0 auto;background:#fbfaf7;box-shadow:0 0 12px rgba(0,0,0,.25);}" +
        '.block{position:absolute;overflow:visible;white-space:nowrap;line-height:1.2;font-family:"GFS Didot","Libre Bodoni","Times New Roman",serif;color:#222;padding:0;}' +
        "</style></head><body><div class=\"page\">" + parts.join("\n") + "</div>" +
        "<script src=\"" + base + "html.js\"><\/script></body></html>";
    }

    // fetch the OCR of one page and hand the generated document to the buffer
    function loadOcrPage(fr, page) {
      var base = new URL(".", location.href).href;
      var url = base + "rectangles/" + editVolume() + "/" + page + ".ocr.txt";
      var token = "p" + page;
      fetch(url)
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.text();
        })
        .then(function (text) {
          if (String(current) !== String(page)) return;      // user moved on
          fr.srcdoc = buildPageHtml(page, parseOcr(text), token);
        })
        .catch(function (err) {
          console.warn("test.html: no OCR at " + url + " (" + err.message + ")");
          if (String(current) === String(page)) giveUp(fr);
        });
    }

    function load(n) {
      current = clamp(n);
      var target = frames[1 - activeIdx];
      // nothing on screen yet (first page) -> use the paper-coloured cover
      if (!havePage) showCover();
      target.dataset.pending = "p" + current;
      loadOcrPage(target, current);
      // only show the waiting indicator if the page is really slow
      if (busyTimer) clearTimeout(busyTimer);
      busyTimer = setTimeout(showBusy, 150);
      volInput.value = volume;
      pageInput.value = current;
      info.textContent = volume + " — Page " + current + " / " + MAX;
      prevBtn.disabled = current <= MIN;
      nextBtn.disabled = current >= MAX;
      if (colMapping && colMapping[current] !== undefined) {
        colParam = String(colMapping[current]);
      }
      updateEditLink();
      updateUrl();
    }

    // page -> first column. A trailing "x2" (or "xN") on an anchor means the
    // same column numbers are printed on N consecutive pages (typically the
    // original text on one page and its translation on the next), e.g.
    //   206:7-8 x2   ->  206 -> 7-8   and   207 -> 7-8,  208 -> 9-10 ...
    // A "norepeat" line right after an anchor stops that anchor after its first
    // group: it only covers the N pages that share the numbers, the pages after
    // them get no column at all, e.g.
    //   2001:665-666 x2 / norepeat -> 2001, 2002 -> 665   (nothing for 2003+)
    var colGroups = null;

    function buildMapping(text) {
      var blocks = [];
      text.split(/\r?\n/).forEach(function (line) {
        line = line.trim();
        if (!line) return;
        if (/^norepeat$/i.test(line)) {
          if (blocks.length) blocks[blocks.length - 1].norepeat = true;
          return;
        }
        var m = line.match(/^(\d+):(\d+)(?:-(\d+))?(?:\s*x\s*(\d+))?/i);
        if (m) {
          var page = parseInt(m[1], 10);
          var first = parseInt(m[2], 10);
          var last = m[3] ? parseInt(m[3], 10) : first;
          var copies = m[4] ? parseInt(m[4], 10) : 1;
          blocks.push({ page: page, first: first, stride: last - first + 1, copies: copies, norepeat: false });
        }
      });

      var mapping = {};
      var groups = {};
      for (var i = 0; i < blocks.length; i++) {
        var b = blocks[i];
        var end = i + 1 < blocks.length ? blocks[i + 1].page - 1 : MAX;
        var copies = Math.max(1, b.copies);
        // "norepeat": the anchor stops after its first group of `copies` pages
        if (b.norepeat && copies > 1) {
          end = Math.min(end, b.page + copies - 1);
        }
        var n = b.page;
        var c = b.first;
        var k = 0;
        while (n <= end) {
          mapping[n] = c;
          if (copies > 1) {
            var idx = k % copies;
            var start = n - idx;
            groups[n] = {
              start: start,
              end: Math.min(end, start + copies - 1),
              index: idx,
              copies: copies
            };
          }
          k += 1;
          // the column advances only once the N pages sharing it are done
          if (k % copies === 0) c += b.stride;
          n += 1;
        }
      }
      colGroups = groups;
      return mapping;
    }

    var colMapping = null;
    var colList = null;          // ordered page numbers that carry a column
    var colIndexByPage = null;   // page -> index inside colList

    // Per-page column list, sorted by COLUMN (not by page): every mapped page
    // appears once, ordered by its column number, ties broken by page number.
    // This is what makes navigation follow the numbering, e.g.
    //   … 145 (col 663) → 2001 (col 665) → 146 (col 667) …
    function buildColList(mapping) {
      var pages = Object.keys(mapping).map(Number);
      pages.sort(function (a, b) {
        var ca = mapping[a];
        var cb = mapping[b];
        if (ca !== cb) return ca - cb;
        return a - b;
      });
      colList = pages;
      colIndexByPage = {};
      for (var i = 0; i < pages.length; i++) {
        colIndexByPage[pages[i]] = i;
      }
    }

    // step by one entry of the column list; falls back to page ± 1 for pages
    // that have no column (before the first anchor, or a volume without a
    // columns file at all)
    function goStep(delta) {
      if (colList && colIndexByPage) {
        var i = colIndexByPage[current];
        if (i !== undefined) {
          var j = i + delta;
          if (j >= 0 && j < colList.length) {
            load(colList[j]);
            return;
          }
        }
      }
      load(current + delta);
    }

    function fetchColMapping() {
      return fetch("columns/" + volume + ".txt")
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.text();
        })
        .then(function (text) {
          colMapping = buildMapping(text);
          buildColList(colMapping);
          // the mapping may arrive after the first page was shown: put the
          // column of the current page into the URL as well
          if (colMapping && colMapping[current] !== undefined) {
            colParam = String(colMapping[current]);
            updateUrl();
          }
          updateSides();
          return colMapping;
        });
    }

    function redirecToCol(col) {
      col = parseInt(col, 10);
      if (isNaN(col)) return;

      var go = function () {
        var mapping = colMapping || {};

        console.log("columns/" + volume + ".txt mapping (" + Object.keys(mapping).length + " entries):");
        console.table(mapping);

        var pages = Object.keys(mapping).map(Number).sort(function (a, b) { return a - b; });

        // split into sections: a new section starts where the column number
        // falls (e.g. it renumbers at 1). Equal values are legitimate: pages
        // that share the same columns (the "x2" runs) must stay in one section.
        var sections = [], cur = [];
        pages.forEach(function (p) {
          if (cur.length && mapping[p] < mapping[cur[cur.length - 1]]) {
            sections.push(cur);
            cur = [];
          }
          cur.push(p);
        });
        if (cur.length) sections.push(cur);

        // inside an "xN" run both pages carry the same numbers: always land on
        // the first page of the run (the original) unless side=lat asks for the
        // translation page
        function pickInRun(p) {
          var g = colGroups ? colGroups[p] : null;
          if (!g) return p;
          if (sideParam === "lat" && g.end > g.start) return g.start + 1;
          return g.start;
        }

        // 1) EXACT match first: a page whose column IS the requested number.
        //    This is what makes ?col=665 reach the 2001+ run when 665 simply
        //    does not exist in the earlier run.
        var exact = null;
        for (var e = 0; e < pages.length; e++) {
          if (mapping[pages[e]] === col) {
            exact = pages[e];
            break;                       // smallest page = earliest section
          }
        }
        if (exact !== null) {
          load(pickInRun(exact));
          return;
        }

        // 2) otherwise the nearest preceding column, in the FIRST section that
        //    reaches the requested number
        var target = null;
        for (var s = 0; s < sections.length && target === null; s++) {
          var sec = sections[s];
          if (mapping[sec[sec.length - 1]] < col) continue;   // column beyond this section
          sec.forEach(function (p) {
            if (mapping[p] <= col) target = p;
          });
        }
        if (target === null && sections.length) {
          var last = sections[sections.length - 1];
          target = last[last.length - 1];                      // clamp to the very end
        }
        if (target !== null) load(pickInRun(target));
      };

      if (colMapping) {
        go();
      } else {
        fetchColMapping().then(go).catch(function (err) {
          console.error("redirecToCol: could not load columns/" + volume + ".txt: " + err.message);
        });
      }
    }
    window.redirecToCol = redirecToCol;

    prevBtn.addEventListener("click", function () { goStep(-1); });
    nextBtn.addEventListener("click", function () { goStep(+1); });
    document.getElementById("sideGrc").addEventListener("click", function () { showSide("grc"); });
    document.getElementById("sideLat").addEventListener("click", function () { showSide("lat"); });
    document.getElementById("go").addEventListener("click", function () {
      volume = resolveVolume(volInput.value);
      colMapping = null;                 // volume changed: reload its columns file
      load(parseInt(pageInput.value, 10));
    });
    var imgPopup = document.getElementById("imgPopup");
    var imgPopupImg = document.getElementById("imgPopupImg");
    var imgScale = 1;
    var imgX = 0;
    var imgY = 0;
    var dragging = false;
    var dragStartX = 0;
    var dragStartY = 0;

    function applyImgTransform() {
      imgPopupImg.style.transform = "translate(" + imgX + "px," + imgY + "px) scale(" + imgScale + ")";
    }

    function setImgScale(s) {
      imgScale = Math.max(0.1, Math.min(20, s));
      applyImgTransform();
    }

    function openImgPopup(page) {
      imgPopupImg.src = "rectangles/" + editVolume() + "/" + page + ".png";
      imgScale = 1;
      imgX = 0;
      imgY = 0;
      applyImgTransform();
      imgPopup.classList.add("open");
    }

    function closeImgPopup() {
      dragging = false;
      imgPopup.classList.remove("open");
    }

    document.getElementById("img").addEventListener("click", function () {
      volume = resolveVolume(volInput.value);
      current = clamp(parseInt(pageInput.value, 10));
      openImgPopup(current);
    });
    document.getElementById("imgClose").addEventListener("click", closeImgPopup);
    document.getElementById("summary").addEventListener("click", function () {
      window.open("search.html?vol=" + editVolume(), "_blank");
    });
    document.getElementById("elenchus").addEventListener("click", function () {
      window.open("https://pg.graeca.org/toc.html?vol=" + editVolume(), "_blank");
    });
    document.getElementById("analtoc").addEventListener("click", function () {
      window.open("https://pg.graeca.org/analtoc.html?vol=" + editVolume(), "_blank");
    });
    imgPopup.addEventListener("click", function (e) {
      if (e.target === this) closeImgPopup();
    });
    imgPopupImg.addEventListener("mousedown", function (e) {
      if (e.button !== 0) return;
      dragging = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      imgPopupImg.classList.add("dragging");
      e.preventDefault();
    });
    document.addEventListener("mousemove", function (e) {
      if (!dragging) return;
      imgX += e.clientX - dragStartX;
      imgY += e.clientY - dragStartY;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      applyImgTransform();
    });
    document.addEventListener("mouseup", function () {
      dragging = false;
      imgPopupImg.classList.remove("dragging");
    });
    imgPopup.addEventListener("wheel", function (e) {
      e.preventDefault();
      setImgScale(imgScale * (e.deltaY < 0 ? 1.1 : 1 / 1.1));
    }, { passive: false });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeImgPopup();
    });
    pageInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") load(parseInt(pageInput.value, 10));
    });
    volInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        volume = resolveVolume(volInput.value);
        load(parseInt(pageInput.value, 10));
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowLeft") goStep(-1);
      else if (e.key === "ArrowRight") goStep(+1);
    });

    var init = readParams();
    volume = init.vol;
    if (new URLSearchParams(window.location.search).get("edit") === "on") {
      document.body.classList.add("edit-on");
    }
    fetchColMapping().catch(function () { colMapping = null; });
    if (init.page !== null) {
      load(init.page);
    } else {
      load(MIN);
    }
    if (init.col && typeof window.redirecToCol === "function") {
      window.redirecToCol(init.col);
    }
  })();
</script>
